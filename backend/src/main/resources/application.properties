spring.application.name=backend
server.port=${PORT:8080}

# Path (relative to the working directory the app is started from) to the preprocessed
# GeoJSON produced by ../data-pipeline. See data-cache/README.md.
app.data.dir=data-cache/processed

# Comma-separated list of allowed CORS origins/patterns (see CorsConfig). Include the deployed
# frontend's real origin in production, e.g. via the APP_CORS_ALLOWED_ORIGINS env var.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
